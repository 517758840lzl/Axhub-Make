name: loan_calculator_flutter
description: Loan calculator for iOS and Android, aligned with the Make prototype.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  provider: 6.1.5+1
  shared_preferences: 2.4.0
  google_fonts: 6.3.3
  intl: 0.20.3
  uuid: 4.6.0
  lucide_icons_flutter: 3.1.20
  webview_flutter: 4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#D2C6FB"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true
  background_color_ios: "#D2C6FB"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/privacy/privacy-policy.html
